<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Industrial Safety Platform</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f7fb;
}

.header{
    background:#1677ff;
    color:white;
    padding:20px;
    text-align:center;
}

.language{
    position:fixed;
    top:20px;
    right:20px;
}

.language button{
    margin:5px;
    padding:8px 15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:white;
    font-weight:bold;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card h2{
    margin:0;
    color:#1677ff;
}

.alert{
    color:red;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:20px;
    color:gray;
}

</style>
</head>

<body>

<div class="language">
<button onclick="setLanguage('zh')">中文</button>
<button onclick="setLanguage('en')">English</button>
<button onclick="setLanguage('kr')">한국어</button>
</div>

<div class="header">
<h1 id="title">AI工业安全监测平台</h1>
<p id="subtitle">实时监测工人安全状态</p>
</div>

<div class="dashboard">

<div class="card">
<h2 id="workers">工人数量</h2>
<h1>128</h1>
</div>

<div class="card">
<h2 id="helmet">安全帽佩戴率</h2>
<h1>97%</h1>
</div>

<div class="card">
<h2 id="temperature">现场温度</h2>
<h1>26°C</h1>
</div>

<div class="card">
<h2 id="heart">心率异常人数</h2>
<h1 class="alert">2</h1>
</div>

<div class="card">
<h2 id="danger">危险区域报警</h2>
<h1 class="alert">1</h1>
</div>

<div class="card">
<h2 id="emergency">紧急救援状态</h2>
<h1 style="color:green;">正常</h1>
</div>

</div>

<div class="footer">
<p id="footerText">
AI智能安全系统 · 实时预防工地危险事故
</p>
</div>

<script>

const languageData = {

zh:{
title:"AI工业安全监测平台",
subtitle:"实时监测工人安全状态",
workers:"工人数量",
helmet:"安全帽佩戴率",
temperature:"现场温度",
heart:"心率异常人数",
danger:"危险区域报警",
emergency:"紧急救援状态",
footer:"AI智能安全系统 · 实时预防工地危险事故"
},

en:{
title:"AI Industrial Safety Platform",
subtitle:"Real-time Worker Safety Monitoring",
workers:"Workers",
helmet:"Helmet Wearing Rate",
temperature:"Site Temperature",
heart:"Abnormal Heart Rate",
danger:"Danger Zone Alarm",
emergency:"Emergency Rescue Status",
footer:"AI Smart Safety System · Preventing Construction Accidents"
},

kr:{
title:"AI 산업 안전 모니터링 플랫폼",
subtitle:"실시간 작업자 안전 모니터링",
workers:"작업자 수",
helmet:"안전모 착용률",
temperature:"현장 온도",
heart:"심박 이상 인원",
danger:"위험 구역 경보",
emergency:"긴급 구조 상태",
footer:"AI 스마트 안전 시스템 · 사고 예방"
}

};

function setLanguage(lang){

document.getElementById("title").innerText =
languageData[lang].title;

document.getElementById("subtitle").innerText =
languageData[lang].subtitle;

document.getElementById("workers").innerText =
languageData[lang].workers;

document.getElementById("helmet").innerText =
languageData[lang].helmet;

document.getElementById("temperature").innerText =
languageData[lang].temperature;

document.getElementById("heart").innerText =
languageData[lang].heart;

document.getElementById("danger").innerText =
languageData[lang].danger;

document.getElementById("emergency").innerText =
languageData[lang].emergency;

document.getElementById("footerText").innerText =
languageData[lang].footer;

}

</script>

</body>
</html>
