<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Industrial Safety Platform</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f7fb;
}

.header{
background:#1677ff;
color:white;
padding:30px;
text-align:center;
}

.language{
position:fixed;
top:20px;
right:20px;
}

.language button{
margin:5px;
padding:10px 16px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
background:white;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:20px;
padding:30px;
}

.card{
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card h2{
margin-top:0;
color:#1677ff;
}

.table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

.table th{
background:#1677ff;
color:white;
padding:12px;
}

.table td{
padding:12px;
text-align:center;
border-bottom:1px solid #eee;
}

.safe{
color:green;
font-weight:bold;
}

.warning{
color:orange;
font-weight:bold;
}

.danger{
color:red;
font-weight:bold;
}

.alert-box{
padding:15px;
border-radius:12px;
margin-top:15px;
font-weight:bold;
}

.yellow{
background:#fff3cd;
}

.red{
background:#f8d7da;
}

.green{
background:#d1e7dd;
}

.footer{
text-align:center;
padding:20px;
color:gray;
}

</style>
</head>

<body>

<div class="language">
<button onclick="setLanguage('zh')">中文</button>
<button onclick="setLanguage('en')">English</button>
<button onclick="setLanguage('kr')">한국어</button>
</div>

<div class="header">
<h1 id="title">AI工业安全监测平台</h1>
<p id="subtitle">
实时监测工人安全状态与危险环境
</p>
</div>

<div class="dashboard">

<div class="card">

<h2 id="workerMonitor">
实时工人监测
</h2>

<table class="table">

<tr>
<th>ID</th>
<th id="nameText">姓名</th>
<th id="heartText">心率</th>
<th id="statusText">状态</th>
<th id="riskText">风险</th>
</tr>

<tr>
<td>A102</td>
<td>Kim</td>
<td>78</td>
<td class="safe" id="safe1">正常</td>
<td class="safe">SAFE</td>
</tr>

<tr>
<td>B204</td>
<td>Lee</td>
<td>121</td>
<td class="warning" id="warning1">疲劳</td>
<td class="warning">WARNING</td>
</tr>

<tr>
<td>C333</td>
<td>Park</td>
<td>135</td>
<td class="danger" id="danger1">危险</td>
<td class="danger">DANGER</td>
</tr>

</table>

</div>

<div class="card">

<h2 id="alertTitle">
AI实时预警
</h2>

<div class="alert-box yellow"
id="alert1">

⚠️ 检测到工人 Lee 长时间疲劳作业

</div>

<div class="alert-box red"
id="alert2">

🚨 工人 Park 心率异常，已启动紧急预警

</div>

<div class="alert-box green"
id="alert3">

✅ 系统运行正常，现场环境稳定

</div>

</div>

<div class="card">

<h2 id="siteData">
工地环境数据
</h2>

<h3 id="tempText">现场温度：26°C</h3>
<h3 id="humidityText">空气湿度：58%</h3>
<h3 id="noiseText">噪音等级：中等</h3>
<h3 id="helmetText">安全帽佩戴率：97%</h3>

</div>

<div class="card">

<h2 id="emergencyTitle">
紧急救援状态
</h2>

<h1 class="safe"
id="emergencyStatus">

正常运行

</h1>

<p id="emergencyDesc">

系统已连接医院与现场急救中心

</p>

</div>

</div>

<div class="footer">

<p id="footerText">

AI智能安全系统 · 实时预防工地危险事故

</p>

</div>

</script>

</body>
</html>
